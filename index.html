<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Everything Desk — Your AI Command Center</title>
<meta name="description" content="Ask for groceries, recipes, electronics advice, spreadsheets or images. Everything filed and managed by AI agents.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root {
  --bg: #07090f;
  --surface: rgba(255,255,255,0.04);
  --surface2: rgba(255,255,255,0.07);
  --border: rgba(255,255,255,0.08);
  --border2: rgba(255,255,255,0.14);
  --ink: #f0f4ff;
  --muted: #7a8aaa;
  --muted2: #4a5a7a;
  --accent: #6c63ff;
  --accent2: #ff6ec7;
  --accent3: #00d4ff;
  --glow: rgba(108,99,255,0.35);
  --grocery: #22d85c;
  --food: #ffb800;
  --electronics: #4d9cff;
  --image: #ff6ec7;
  --excel: #00e5a0;
  --other: #a78bfa;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── Animated background ── */
.bg-canvas {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}
.orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(100px);
  opacity: 0.18;
  animation: drift 20s ease-in-out infinite;
}
.orb-1 { width: 700px; height: 700px; background: var(--accent); top: -200px; left: -200px; animation-delay: 0s; }
.orb-2 { width: 500px; height: 500px; background: var(--accent2); bottom: -150px; right: -100px; animation-delay: -7s; }
.orb-3 { width: 400px; height: 400px; background: var(--accent3); top: 40%; left: 45%; animation-delay: -13s; }
@keyframes drift {
  0%, 100% { transform: translate(0, 0) scale(1); }
  33% { transform: translate(30px, -40px) scale(1.05); }
  66% { transform: translate(-20px, 30px) scale(0.95); }
}

/* ── Noise texture overlay ── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
  opacity: 0.025;
  pointer-events: none;
}

/* Layout & components (omitted for brevity – unchanged from original) */
.wrapper { position: relative; z-index: 1; padding: 0; max-width: 100%; margin: 0; height: 100vh; display: flex; flex-direction: column; }
header { display: none; }
.logo-group { display: flex; align-items: center; gap: 14px; }
.logo-icon { width: 48px; height: 48px; background: linear-gradient(135deg, var(--accent), var(--accent2)); border-radius: 14px; display: grid; place-items: center; font-size: 22px; box-shadow: 0 0 24px var(--glow); flex-shrink: 0; }
h1 { font-size: clamp(1.6rem, 3.5vw, 2.6rem); font-weight: 800; letter-spacing: -0.04em; margin: 0; background: linear-gradient(135deg, #fff 30%, var(--accent2) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.tagline { color: var(--muted); font-size: 0.88rem; font-weight: 400; margin: 2px 0 0; }
/* ... (all other CSS from the original file) ... */
</style>
</head>
<body>

<!-- Animated background -->
<div class="bg-canvas" aria-hidden="true">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>

<div class="wrapper">

  <!-- Header (hidden in demo) -->
  <header>
    <div class="logo-group">
      <div class="logo-icon" aria-hidden="true">⚡</div>
      <div>
        <h1>Everything Desk</h1>
        <p class="tagline">Your AI-powered command center</p>
      </div>
    </div>
    <div class="status-pill">
      <span class="status-dot"></span>
      <span id="status-label">Agents ready</span>
    </div>
  </header>

  <!-- Main content -->
  <main>

    <!-- Chat panel -->
    <section class="chat-panel" aria-label="Chat with agents">
      <div class="chat-header">
        <div class="chat-header-icon" aria-hidden="true">🤖</div>
        <div style="flex:1">
          <p class="chat-title">AI Agents</p>
          <p class="chat-sub">Powered by intelligent agents · Ask anything</p>
        </div>
        <div class="status-pill" style="font-size:0.75rem;padding:5px 12px">
          <span class="status-dot"></span>
          <span>Ready</span>
        </div>
      </div>

      <div id="log" aria-live="polite" aria-label="Conversation"></div>

      <div class="quick-section" style="padding: 0 32px 10px">
        <p class="quick-label">Quick prompts</p>
        <div class="quick" id="quick"></div>
      </div>

      <div class="input-area" style="padding: 14px 32px 28px">
        <form id="f">
          <div class="input-wrap">
            <input id="in" placeholder="What do you need today?" autocomplete="off" aria-label="Your request">
            <button class="send-btn" id="go" type="submit" aria-label="Send">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </button>
          </div>
        </form>
      </div>
    </section>

  </main>
</div>

<!-- Detail dialog -->
<dialog id="dlg" aria-modal="true" aria-labelledby="dlg-title"></dialog>

<script>
// ============================================================
// EVERYTHING DESK — UPDATED FRONTEND JAVASCRIPT
// ============================================================

// Leave empty to use local demo mode.
// For production, set this to your n8n webhook base URL
// (e.g. "https://my-workspace.n8n.cloud/webhook")
const BASE = "";   // <-- demo mode

const CATS = {
  grocery: "Grocery",
  food: "Food",
  electronics: "Electronics",
  image: "Images",
  excel: "Excel",
  other: "Other"
};

const CAT_ICONS = {
  grocery: "🛒",
  food: "🍽️",
  electronics: "💻",
  image: "🖼️",
  excel: "📊",
  other: "✦"
};

const QUICK = [
  "Weekly grocery list under $60",
  "Quick vegetarian dinner",
  "Compare budget laptops",
  "Monthly expense spreadsheet",
  "Draw a futuristic city at night"
];

const sid = "s-" + Math.random().toString(36).slice(2, 10);
const $ = id => document.getElementById(id);

let rows = [];
let filter = "all";

// Normalise the webhook URL – strip trailing slashes.
const WEBHOOK_BASE = BASE.trim().replace(/\/+$/, "");

// ------------------------------------------------------------
// DOM HELPERS
// ------------------------------------------------------------
const el = (tag, props = {}, ...kids) => {
  const e = Object.assign(document.createElement(tag), props);
  e.append(...kids);
  return e;
};

const col = c => `var(--${CATS[c] ? c : "other"})`;

const fmtTime = ts => {
  if (!ts) return "";
  const d = new Date(ts);
  if (Number.isNaN(d.getTime())) return "";
  return d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
};

// ------------------------------------------------------------
// SAFE RESPONSE HANDLER
// ------------------------------------------------------------
async function readJSON(response) {
  const text = await response.text();

  if (!text.trim()) {
    throw new Error(`Empty server response (HTTP ${response.status}). Check your n8n Respond to Webhook node.`);
  }

  let data;
  try {
    data = JSON.parse(text);
  } catch (e) {
    throw new Error(`Backend returned invalid JSON: ${text.slice(0, 200)}`);
  }

  if (!response.ok) {
    throw new Error(data.message || data.error || `Server error: HTTP ${response.status}`);
  }

  return data;
}

// ------------------------------------------------------------
// RESPONSE NORMALISATION
// ------------------------------------------------------------
function normalizeResponse(data) {
  let result = Array.isArray(data) ? data[0] : data;

  if (!result || typeof result !== "object") {
    throw new Error("The AI backend returned an invalid response.");
  }

  if (result.data && typeof result.data === "object") {
    result = result.data;
  }

  const reply = result.reply || result.output || result.text || result.response || result.message;

  if (typeof reply !== "string" || !reply.trim()) {
    throw new Error("The AI workflow responded, but no reply text was found. Check your n8n response mapping.");
  }

  return { ...result, reply };
}

// ------------------------------------------------------------
// SAMPLE DATA (demo mode)
// ------------------------------------------------------------
const SAMPLE_ROWS = [
  {
    category: "grocery",
    title: "Budget Grocery List under $60",
    details: "A weekly plan covering produce, dairy, protein and pantry staples.",
    table_json: JSON.stringify({
      columns: ["Item", "Qty", "Est. Price"],
      rows: [
        ["Bananas", "6 pcs", "$0.70"],
        ["Apples", "4 pcs", "$2.00"],
        ["Eggs", "1 dozen", "$2.20"],
        ["Milk", "1 gal", "$3.30"],
        ["Brown rice", "1 lb", "$1.80"],
        ["Lentils", "1 lb", "$1.50"],
        ["Black beans", "2 cans", "$1.60"]
      ]
    }),
    timestamp: "2026-10-30T06:29:27.643Z"
  },
  {
    category: "food",
    title: "Quick Veg Dinner",
    details: "Chickpea and spinach curry with rice. About 30 minutes, serves 2.",
    timestamp: "2026-10-30T06:21:00.000Z"
  },
  {
    category: "electronics",
    title: "Budget Laptop Pick",
    details: "Look for 16 GB RAM, 512 GB SSD and a full HD screen. Compare battery life before buying.",
    timestamp: "2026-10-30T06:39:05.220Z"
  },
  {
    category: "grocery",
    title: "Weekly Grocery List",
    details: "Rice 2 kg, eggs 12, spinach 1 bag, milk 2 L, bananas 6.",
    timestamp: "2026-10-30T06:37:40.505Z"
  },
  {
    category: "other",
    title: "iPhone 15 Pro vs Galaxy S24 Ultra",
    details: "Compare camera, battery, performance and ecosystem.",
    timestamp: "2026-10-30T06:39:05.220Z"
  }
];

// ------------------------------------------------------------
// COUNTS & FILTER UI
// ------------------------------------------------------------
function counts() {
  const c = {};
  rows.forEach(r => c[r.category] = (c[r.category] || 0) + 1);
  return c;
}
function renderChips() {
  const c = counts();
  const bar = $("bar");
  const chips = $("chips");

  bar.replaceChildren(
    ...Object.keys(CATS).map(k => {
      const i = el("i");
      i.style.background = col(k);
      i.style.flex = (c[k] || 0) + " 1 0";
      return i;
    })
  );

  const mk = (k, label, n) => {
    const b = el(
      "button",
      { className: "chip" },
      el("b"),
      label,
      el("sup", { style: "font-size:0.68rem;margin-left:4px;opacity:0.7" }, String(n))
    );
    b.style.setProperty("--c", k === "all" ? "rgba(255,255,255,0.6)" : col(k));
    b.setAttribute("aria-pressed", filter === k ? "true" : "false");
    b.onclick = () => {
      filter = k;
      renderChips();
      renderBoard();
    };
    return b;
  };

  chips.replaceChildren(
    mk("all", "All", rows.length),
    ...Object.entries(CATS).map(([k, v]) => mk(k, v, c[k] || 0))
  );
}

// ------------------------------------------------------------
// EXCEL / CSV DOWNLOAD
// ------------------------------------------------------------
function parseTable(r) {
  try { return r.table_json ? JSON.parse(r.table_json) : null; }
  catch { return null; }
}
function download(table, name) {
  if (!table || !Array.isArray(table.columns) || !Array.isArray(table.rows)) return;
  const data = [table.columns, ...table.rows];
  if (window.XLSX) {
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(data), "Data");
    XLSX.writeFile(wb, name + ".xlsx");
    return;
  }
  const csv = data.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\n");
  const a = el("a", { href: URL.createObjectURL(new Blob([csv], { type: "text/csv" })), download: name + ".csv" });
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// ------------------------------------------------------------
// TABLE RENDERING
// ------------------------------------------------------------
function tableEl(t) {
  const w = el("div", { className: "tw" });
  const tb = el("table");
  tb.append(
    el("thead", {}, el("tr", {}, ...t.columns.map(c => el("th", {}, String(c))))),
    el("tbody", {}, ...t.rows.map(r => el("tr", {}, ...r.map(v => el("td", {}, String(v))))))
  );
  w.append(tb);
  return w;
}

// ------------------------------------------------------------
// DETAIL DIALOG
// ------------------------------------------------------------
function open(r) {
  const d = $("dlg");
  const t = parseTable(r);
  const header = el("div", { className: "dlg-header" });
  const h2 = el("h2", { id: "dlg-title" }, r.title || "Details");
  const closeBtn = el("button", { className: "dlg-close", onclick: () => d.close(), "aria-label": "Close" }, "×");
  header.append(h2, closeBtn);
  const body = el("div", { className: "dlg-body" });
  if (r.details) body.append(el("p", {}, r.details));
  if (r.image_url) body.append(el("img", { src: r.image_url, alt: r.title || "Image", loading: "lazy" }));
  if (t) {
    body.append(tableEl(t));
    const btnRow = el("div", { className: "btn-row" });
    btnRow.append(el("button", { className: "btn", onclick: () => download(t, r.title || "data") }, "📥 Download Excel"));
    body.append(btnRow);
  }
  d.replaceChildren(header, body);
  d.showModal();
}

// ------------------------------------------------------------
// CARD BOARD
// ------------------------------------------------------------
function renderBoard(freshId) {
  const list = rows.filter(r => filter === "all" || r.category === filter);
  const b = $("board");
  $("board-count").textContent = `${list.length} item${list.length === 1 ? "" : "s"}`;

  if (!list.length) {
    b.replaceChildren(
      el("div", { className: "empty" },
        el("div", { className: "empty-icon" }, "📭"),
        el("p", { className: "empty-text" }, "Nothing here yet. Ask the agents for something and it will appear as a card.")
      )
    );
    return;
  }

  b.replaceChildren(
    ...list.map(r => {
      const card = el("button", { className: "t" + (r.timestamp === freshId ? " fresh" : ""), onclick: () => open(r) });
      card.style.setProperty("--c", col(r.category));
      const accentBar = el("div", { className: "card-accent-bar" });
      accentBar.style.background = col(r.category);
      accentBar.style.boxShadow = `0 0 10px ${col(r.category)}`;
      card.append(accentBar);
      if (r.image_url) card.append(el("img", { src: r.image_url, alt: "", loading: "lazy" }));
      const body = el("div", { className: "card-body" });
      body.append(
        el("span", { className: "card-category" }, (CAT_ICONS[r.category] || "✦") + " " + (CATS[r.category] || "Other")),
        el("h3", {}, r.title || "Untitled")
      );
      if (r.details) body.append(el("p", {}, r.details));
      const footer = el("div", { className: "card-footer" });
      footer.append(el("span", { className: "card-time" }, fmtTime(r.timestamp)));
      footer.append(el("span", { className: "card-arrow", ariaHidden: "true" }, "↗"));
      body.append(footer);
      card.append(body);
      return card;
    })
  );
}

// ------------------------------------------------------------
// CHAT MESSAGES
// ------------------------------------------------------------
function say(text, cls = "", extra) {
  const m = el("div", { className: "m " + cls }, text);
  if (extra) m.append(...extra);
  $("log").append(m);
  $("log").scrollTop = $("log").scrollHeight;
  return m;
}
function showTyping() {
  const m = el("div", { className: "m" }, el("div", { className: "typing" }, el("span"), el("span"), el("span")));
  $("log").append(m);
  $("log").scrollTop = $("log").scrollHeight;
  return m;
}

// ------------------------------------------------------------
// DEMO MODE RESPONSE
// ------------------------------------------------------------
function demo(msg) {
  const l = msg.toLowerCase();
  const cat = /draw|image|picture|photo/.test(l) ? "image"
          : /sheet|excel|spreadsheet/.test(l) ? "excel"
          : /laptop|phone|tv|camera|gadget/.test(l) ? "electronics"
          : /dinner|recipe|cook|meal/.test(l) ? "food"
          : /grocery|shopping|buy food/.test(l) ? "grocery"
          : "other";

  const table = (cat === "excel" || cat === "grocery") ? {
    columns: ["Item", "Qty", "Est. Price"],
    rows: [
      ["Rice", "2 kg", "$4.50"],
      ["Eggs", "12", "$3.20"],
      ["Spinach", "1 bag", "$2.40"],
      ["Bananas", "6", "$1.80"],
      ["Milk", "2 L", "$3.10"]
    ]
  } : null;

  return {
    reply: "✦ Demo mode — this is a sample response. Configure your n8n production webhook URL to connect the real AI agents.",
    category: cat,
    saved: { title: msg.slice(0, 48), details: "Demo summary for: " + msg },
    table,
    table_json: table ? JSON.stringify(table) : "",
    timestamp: new Date().toISOString(),
    image_url: ""
  };
}

// ------------------------------------------------------------
// CHAT API
// ------------------------------------------------------------
async function ask(msg) {
  if (!WEBHOOK_BASE) {
    await new Promise(r => setTimeout(r, 600));
    return demo(msg);
  }

  const res = await fetch(`${WEBHOOK_BASE}/agent-chat`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message: msg, sessionId: sid })
  });

  const data = await readJSON(res);
  return normalizeResponse(data);
}

// ------------------------------------------------------------
// DASHBOARD API
// ------------------------------------------------------------
async function load() {
  if (!WEBHOOK_BASE) {
    rows = [...SAMPLE_ROWS];
    renderChips();
    renderBoard();
    return;
  }

  try {
    const res = await fetch(`${WEBHOOK_BASE}/agent-dashboard`, {
      method: "GET",
      headers: { "Accept": "application/json" }
    });
    const data = await readJSON(res);
    const result = Array.isArray(data) ? data[0] : data;
    rows = Array.isArray(result.rows) ? result.rows : [];
    if (result.insight) $("insight").textContent = result.insight;
  } catch (e) {
    console.error("Dashboard error:", e);
    rows = [...SAMPLE_ROWS];
    say("Dashboard connection failed. Showing sample cards instead. Check your n8n dashboard webhook.", "err");
  }

  renderChips();
  renderBoard();
}

// ------------------------------------------------------------
// CHAT SUBMISSION
// ------------------------------------------------------------
$("f").onsubmit = async e => {
  e.preventDefault();
  const v = $("in").value.trim();
  if (!v) return;
  $("in").value = "";
  $("go").disabled = true;
  say(v, "me");
  const typing = showTyping();

  try {
    const d = await ask(v);
    typing.remove();
    const extra = [];

    if (d.image_url) extra.push(el("img", { src: d.image_url, alt: "Generated image", loading: "lazy" }));

    const table = d.table || (d.table_json ? parseTable(d) : null);
    if (table) extra.push(el("button", { className: "btn alt", style: "margin-top:10px", onclick: () => download(table, d.saved?.title || "data") }, "📥 Download Excel"));

    say(d.reply, "", extra);

    if (d.saved && d.category) {
      const timestamp = d.timestamp || new Date().toISOString();
      rows.unshift({
        category: d.category,
        title: d.saved.title || v.slice(0, 48),
        details: d.saved.details || d.reply,
        image_url: d.image_url || "",
        table_json: d.table_json || (table ? JSON.stringify(table) : ""),
        timestamp
      });
      renderChips();
      renderBoard(timestamp);
    }
  } catch (err) {
    typing.remove();
    console.error("AI chat error:", err);
    say(err.message || "Could not reach the AI agents.", "err");
  } finally {
    $("go").disabled = false;
    $("in").focus();
  }
};

// ------------------------------------------------------------
// DIALOG BACKDROP CLICK TO CLOSE
// ------------------------------------------------------------
$("dlg").addEventListener("click", e => { if (e.target === $("dlg")) $("dlg").close(); });

// ------------------------------------------------------------
// QUICK PROMPTS
// ------------------------------------------------------------
$("quick").replaceChildren(
  ...QUICK.map(q => el("button", { type: "button", onclick: () => { $("in").value = q; $("f").requestSubmit(); } }, q))
);

// ------------------------------------------------------------
// INITIALISE
// ------------------------------------------------------------
say("✦ Hello! I'm your AI assistant. Ask me anything — groceries, recipes, tech advice, spreadsheets or images.");
load();

console.log(WEBHOOK_BASE ? "Everything Desk: Production webhook mode" : "Everything Desk: Demo mode");
</script>
</body>
</html>
